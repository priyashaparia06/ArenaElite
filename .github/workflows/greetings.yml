name: Greetings

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    name: Greet First-Time Contributors
    runs-on: ubuntu-latest

    steps:
      - uses: actions/first-interaction@v3
        with:
          issue_message: |
            👋 Hello! Thanks for opening your first issue in ArenaElite!

            We appreciate your contribution. 🏆

            The ArenaElite team will review your issue soon.

          pr_message: |
            👋 Hello! Thanks for opening your first Pull Request in ArenaElite!

            We appreciate your contribution. 🏆

            The ArenaElite team will review your PR soon.